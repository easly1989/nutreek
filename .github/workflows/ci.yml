name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./... -race -count=1

      # The demo build (#137): its wiring, and an end-to-end test that builds the
      # binary, starts it on an empty database, enters and adds a food (#188).
      - name: Run demo build tests
        run: go test -tags demo ./cmd/nutreek/ -race -count=1

      # Italian and English must be complete: TestCatalogs fails otherwise. A
      # community language only warns here, with the keys to translate.
      - name: Check translations
        run: go run ./cmd/i18ncheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Pinned version: `latest` breaks CI when a new linter comes out.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      # The files behind //go:build demo are only linted (and vetted) with the tag.
      - name: Run golangci-lint (demo build)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --build-tags demo

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: CGO_ENABLED=0 go build ./cmd/nutreek

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # govulncheck checks the stdlib's vulnerabilities against the active
      # toolchain: we always use the latest patched stable release,
      # whatever the minimum version declared in go.mod.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
