name: Release

# Builds and publishes the Docker image on GHCR.
#
# Triggers:
#   - publishing a GitHub Release -> version = the release's tag (e.g. v1.2.0)
#   - a manual run (workflow_dispatch) -> optional version; without one it
#     publishes only `:latest` from the chosen branch (useful to republish).
#
# Tags published: `:latest` always, plus `:vX.Y.Z` and `:vX.Y` when there is
# a version. The package inherits the repository's visibility (public)
# through the `org.opencontainers.image.source` label.
#
# A stable release (not a prerelease) is then recorded in versions.json on the
# `site-data` branch, which instances read to tell their owner a newer Nutreek
# is out (#167). A manual run records it too: with no version it only moves the
# sha and date.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish as well (e.g. v1.2.0). Empty = :latest only."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/easly1989/nutreek

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version and tags
        id: vars
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="$RELEASE_TAG"
          else
            VERSION="$INPUT_VERSION"
          fi

          tags="${IMAGE}:latest"
          build_version="latest-${GITHUB_SHA::7}"

          if [ -n "$VERSION" ]; then
            build_version="$VERSION"
            tags="${tags},${IMAGE}:${VERSION}"
            # vX.Y.Z -> also publish the floating tag :vX.Y
            if echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
              minor="$(echo "$VERSION" | grep -oE '^v[0-9]+\.[0-9]+')"
              tags="${tags},${IMAGE}:${minor}"
            fi
          fi

          {
            echo "version=$VERSION"
            echo "tags=$tags"
            echo "build_version=$build_version"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing: $tags (VERSION=$build_version)"

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.vars.outputs.build_version }}
          tags: ${{ steps.vars.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/easly1989/nutreek
            org.opencontainers.image.title=nutreek
            org.opencontainers.image.version=${{ steps.vars.outputs.build_version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-version:
    needs: build-push
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-version
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Record the release in versions.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish-version.sh "${{ needs.build-push.outputs.version }}"
