# Config format v2 (golangci-lint >= 2.0, required for Go >= 1.25).
# NOTE: misspell deliberately excluded — the user-facing text is Italian
# (until #141) and the English dictionary produces hundreds of false
# positives (e.g. "momento" flagged as a typo of "memento").
version: "2"

run:
  timeout: 5m

linters:
  # The "standard" set includes: errcheck, govet, ineffassign, staticcheck
  # (which in v2 also absorbs the old gosimple) and unused.
  default: standard
  settings:
    staticcheck:
      # Parity with v1: SA* (staticcheck) + S* (formerly gosimple). Excluded:
      # ST* (stylecheck, never enabled before) and QF* (stylistic "quickfix"
      # suggestions, not bugs).
      checks: ["all", "-ST1*", "-QF1*"]
  exclusions:
    presets:
      # Standard errcheck exclusions (defer Close, fmt.Print*, etc.) that
      # were on by default in v1.
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
