services:
  nutreek:
    # Public image published by the Release workflow.
    # `docker compose pull && docker compose up -d` updates to the latest release;
    # `docker compose up --build` builds from the local source instead.
    image: ghcr.io/easly1989/nutreek:latest
    build: .
    container_name: nutreek
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      NUTREEK_ADDR: ":8080"
      NUTREEK_DB_PATH: /data/nutreek.db
      NUTREEK_ENV: prod
      NUTREEK_SESSION_KEY: ${NUTREEK_SESSION_KEY:?set NUTREEK_SESSION_KEY in env (es. openssl rand -hex 32)}
      NUTREEK_OFF_BASE_URL: ${NUTREEK_OFF_BASE_URL:-https://world.openfoodfacts.org}
      NUTREEK_RECONCILE_ENABLED: ${NUTREEK_RECONCILE_ENABLED:-true}
      NUTREEK_RECONCILE_INTERVAL: ${NUTREEK_RECONCILE_INTERVAL:-24h}
      NUTREEK_ADMIN_TOKEN: ${NUTREEK_ADMIN_TOKEN:-}
    restart: unless-stopped
    # Healthcheck: distroless has no shell nor wget/curl. The binary
    # supports `-healthcheck` (a subcommand in cmd/nutreek/main.go) that
    # does a local GET on /healthz and exits with 0 / 1.
    healthcheck:
      test: ["CMD", "/app/nutreek", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
