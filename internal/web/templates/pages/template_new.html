{{define "title"}}Nuovo template — Nutreek{{end}}
{{define "content"}}
<div class="flex flex-col gap-4 lg:gap-[18px] max-w-[520px]">
  <div>
    <a href="/piano-nutrizionale?tab=template" class="crumb">{{template "icon_sm" "i-chevron-left"}}Piano nutrizionale</a>
    <h1 class="h1">Nuovo template</h1>
    <p class="text-muted mt-1">Dagli un nome, poi aggiungi i pasti della settimana.</p>
  </div>
  {{if .Error}}<p class="rounded-xl bg-danger-soft text-danger px-4 py-2.5" role="alert">{{.Error}}</p>{{end}}
  <form method="post" action="/templates" class="card p-4 flex flex-col gap-3">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <label class="lab">Nome<input name="name" required maxlength="200" value="{{.Name}}" placeholder="es. Settimana standard, In trasferta" class="field" autofocus></label>
    <div class="flex justify-end gap-2 pt-1">
      <a href="/piano-nutrizionale?tab=template" class="btn-secondary">Annulla</a>
      <button class="btn-primary">Crea template</button>
    </div>
  </form>
</div>
{{end}}
