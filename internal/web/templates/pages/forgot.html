{{define "title"}}{{t "auth.forgot.title"}} — Nutreek{{end}}
{{define "content"}}
<div class="auth-box">
  <div class="text-center">
    <h1 class="h1">{{t "auth.forgot.title"}}</h1>
    <p class="text-muted mt-1">{{t "auth.forgot.subtitle"}}</p>
  </div>
  {{if .Error}}<p role="alert" class="rounded-xl bg-danger-soft text-danger px-4 py-2.5">{{.Error}}</p>{{end}}
  <form method="post" action="/forgot" class="card">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <label class="lab">{{t "auth.field.email"}}<input id="email" name="email" type="email" required autofocus autocomplete="email" value="{{.Form.Email}}" class="field field-lg"></label>
    <button class="btn-primary btn-block">{{t "auth.forgot.submit"}}</button>
  </form>
  <p class="text-center"><a href="/login" class="text-accent font-semibold hover:underline">{{t "auth.back_to_login"}}</a></p>
</div>
{{end}}
