{{define "title"}}Ingredienti — Nutreek{{end}}
{{define "content"}}
<div class="max-w-3xl">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-3xl font-semibold">Ingredienti</h1>
    <a href="/ingredients/new" class="inline-block bg-accent text-accent-fg rounded px-4 py-2 hover:bg-accent/90">Nuovo</a>
  </div>

  <p class="text-sm text-muted mb-4">
    Pool condiviso fra tutti gli utenti. La ricerca live filtra il DB locale; in tappa 7 si aggiungera' il fallback OpenFoodFacts.
  </p>

  <div class="mb-3">
    <input
      type="search"
      name="q"
      value="{{.Query}}"
      placeholder="Cerca per nome..."
      class="w-full rounded border border-border px-3 py-2 focus:outline-none focus:ring-2 focus:ring-accent"
      data-ingredient-search
      data-search-url="/ingredients/search"
      data-search-target="#ingredient-results"
      data-search-spinner="#ingredient-search-spinner"
      autocomplete="off"
      autofocus
    >
  </div>

  <div id="ingredient-search-spinner" class="hidden mb-3 flex items-center gap-2 text-xs text-muted px-1">
    <span class="inline-block h-3 w-3 rounded-full border-2 border-muted border-t-transparent animate-spin" aria-hidden="true"></span>
    <span>Cerco anche su OpenFoodFacts…</span>
  </div>

  <div id="ingredient-results">
    {{template "ingredient_results" .}}
  </div>
</div>
{{end}}
