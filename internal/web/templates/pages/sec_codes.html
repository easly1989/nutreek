{{define "title"}}{{t "security.codes.title"}} — Nutreek{{end}}
{{define "content"}}
<div class="flex flex-col gap-4 max-w-[460px] mx-auto">
  <header class="text-center">
    <p class="text-muted text-sm" aria-hidden="true">3 / 3</p>
    <h1 class="h1">{{t "security.codes.title"}}</h1>
    <p class="text-muted mt-1">{{t "security.codes.text"}}</p>
  </header>
  <ul class="grid grid-cols-2 gap-x-4 gap-y-2 rounded-xl border border-border bg-surface-2 p-3 font-mono text-[15px] select-all" id="recovery-codes">
    {{range .Codes}}<li>{{.}}</li>{{end}}
  </ul>
  <button type="button" class="btn-secondary btn-block" data-copy-codes>{{t "security.codes.copy"}}</button>
  <a href="/settings/sicurezza" class="btn-primary btn-block">{{t "security.codes.done"}}</a>
</div>
{{end}}
{{define "scripts"}}
<script>
(function () {
  var b = document.querySelector("[data-copy-codes]"), l = document.getElementById("recovery-codes");
  if (!b || !l) return;
  b.addEventListener("click", function () {
    var t = Array.prototype.map.call(l.children, function (x) { return x.textContent; }).join("\n");
    if (navigator.clipboard) navigator.clipboard.writeText(t).catch(function () {});
  });
})();
</script>
{{end}}
