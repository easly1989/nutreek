{{define "title"}}Login - Nutreek{{end}}
{{define "content"}}
<div class="max-w-md mx-auto">
  <h1 class="text-2xl font-semibold mb-6">Accedi</h1>
  {{if .Error}}
    <div class="mb-4 rounded border border-rose-200 bg-rose-50 text-rose-900 px-4 py-2 text-sm">{{.Error}}</div>
  {{end}}
  <form method="post" action="/login" class="space-y-4 bg-surface p-6 rounded border border-border">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <div>
      <label class="block text-sm font-medium mb-1" for="email">Email</label>
      <input id="email" name="email" type="email" required autofocus value="{{.Form.Email}}"
             class="w-full border border-border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-accent">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1" for="password">Password</label>
      <input id="password" name="password" type="password" required
             class="w-full border border-border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-accent">
    </div>
    <button type="submit" class="w-full bg-accent text-accent-fg rounded py-2 hover:bg-accent/90">Entra</button>
  </form>
  <p class="text-sm text-muted mt-4 text-center">Non hai un account? <a href="/register" class="underline">Registrati</a></p>
</div>
{{end}}
