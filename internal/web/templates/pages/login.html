{{define "title"}}{{t "auth.login.title"}} — Nutreek{{end}}
{{define "content"}}
<div class="auth-box">
  <div class="text-center">
    <h1 class="h1">{{t "auth.login.title"}}</h1>
    <p class="text-muted mt-1">{{t "auth.login.subtitle"}}</p>
  </div>
  {{if .Error}}<p role="alert" class="rounded-xl bg-danger-soft text-danger px-4 py-2.5">{{.Error}}</p>{{end}}
  <form method="post" action="/login" class="card">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <label class="lab">{{t "auth.field.email"}}<input id="email" name="email" type="email" required autofocus autocomplete="email" value="{{.Form.Email}}" class="field field-lg"></label>
    <label class="lab">{{t "auth.field.password"}}<span class="field-pw"><input id="password" name="password" type="password" required autocomplete="current-password" class="field field-lg">{{template "pw_toggle" "password"}}</span></label>
    <button class="btn-primary btn-block">{{t "auth.login.submit"}}</button>
  </form>
  <p class="text-center text-muted">{{t "auth.login.no_account"}} <a href="/register" class="text-accent font-semibold hover:underline">{{t "auth.login.register_link"}}</a></p>
</div>
{{end}}
