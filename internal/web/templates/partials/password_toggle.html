{{define "pw_toggle"}}
{{/* Pulsante Mostra/Nascondi dentro <span class="field-pw">; . = id del campo. */}}
<button type="button" class="pw-toggle" aria-controls="{{.}}" aria-pressed="false" aria-label="Mostra la password"
        onclick="var i=document.getElementById(this.getAttribute('aria-controls')),on=i.type==='password';i.type=on?'text':'password';this.textContent=on?'Nascondi':'Mostra';this.setAttribute('aria-pressed',on)">Mostra</button>
{{end}}
