{{define "pw_toggle"}}
{{/* Pulsante Mostra/Nascondi dentro <span class="field-pw">; . = id del campo.
     Il nome accessibile contiene il testo visibile: «Mostra la password». */}}
<button type="button" class="pw-toggle" aria-controls="{{.}}"
        onclick="var i=document.getElementById(this.getAttribute('aria-controls')),on=i.type==='password';i.type=on?'text':'password';this.firstChild.textContent=on?'Nascondi':'Mostra'"><span>Mostra</span><span class="sr-only"> la password</span></button>
{{end}}
