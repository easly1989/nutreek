{{define "pw_toggle"}}
{{/* Show/Hide button inside <span class="field-pw">; . = the field's id.
     The accessible name contains the visible text: «Show password». */}}
<button type="button" class="pw-toggle" aria-controls="{{.}}" data-msg-show="{{t "auth.password.show"}}" data-msg-hide="{{t "auth.password.hide"}}"
        onclick="var i=document.getElementById(this.getAttribute('aria-controls')),on=i.type==='password';i.type=on?'text':'password';this.firstChild.textContent=on?this.dataset.msgHide:this.dataset.msgShow"><span>{{t "auth.password.show"}}</span><span class="sr-only"> {{t "auth.password.label"}}</span></button>
{{end}}
