{{define "plan_food_picker"}}
{{- /* Adding a food to a variant of the plan, in a dialog (#251): ingredient or recipe, a live search, the scanner and «new». View model: app.planFoodPickerData. */ -}}
<div data-nutr-picker="{{.VariationID}}" class="-mx-5 -mb-5">
  <div class="flex flex-col gap-2 px-5 pb-3">
    <div class="flex items-center gap-2">
      <span class="segmented" role="radiogroup" aria-label="{{t "plan.kind"}}">
        <button type="button" role="radio" aria-checked="true" class="px-3" data-nutr-tab="ingredient" data-nutr-var="{{.VariationID}}"
                hx-get="/nutrizionista/picker?variation_id={{.VariationID}}&kind=ingredient&q=" hx-target="#nutr-results-{{.VariationID}}" hx-swap="innerHTML">{{t "plan.kind_ingredient"}}</button>
        <button type="button" role="radio" aria-checked="false" class="px-3" data-nutr-tab="recipe" data-nutr-var="{{.VariationID}}"
                hx-get="/nutrizionista/picker?variation_id={{.VariationID}}&kind=recipe&q=" hx-target="#nutr-results-{{.VariationID}}" hx-swap="innerHTML">{{t "plan.kind_recipe"}}</button>
      </span>
      <button type="button" class="btn-ghost h-[30px] px-2 text-[12.5px] ml-auto -mr-2" data-nutr-quick="ingredient" data-nutr-var="{{.VariationID}}" hx-get="/quick/ingredient" hx-target="#modal-host-2" hx-swap="innerHTML">{{template "icon_sm" "i-plus"}}{{t "plan.new_ingredient_short"}}</button>
      <button type="button" class="btn-ghost h-[30px] px-2 text-[12.5px] ml-auto -mr-2 hidden" data-nutr-quick="recipe" data-nutr-var="{{.VariationID}}" hx-get="/quick/recipe" hx-target="#modal-host-2" hx-swap="innerHTML">{{template "icon_sm" "i-plus"}}{{t "plan.new_recipe_short"}}</button>
    </div>
    <div class="flex gap-2">
      <label class="field-ico grow">
        {{template "icon" "i-search"}}
        <input id="nutr-search-{{.VariationID}}" type="search" placeholder="{{t "ingredients.search.placeholder"}}" aria-label="{{t "plan.search"}}" autocomplete="off" class="field"
               data-msg-placeholder-ingredient="{{t "ingredients.search.placeholder"}}" data-msg-placeholder-recipe="{{t "recipes.search"}}"
               data-ingredient-search data-search-url="/nutrizionista/picker"
               data-search-extra="variation_id={{.VariationID}}&kind=ingredient"
               data-search-target="#nutr-results-{{.VariationID}}" data-nutr-var="{{.VariationID}}">
      </label>
      {{template "scan_button" (printf "#nutr-search-%d" .VariationID)}}
    </div>
  </div>
  <div id="nutr-results-{{.VariationID}}" data-picker-list aria-live="polite" class="border-t border-border max-h-[min(360px,50vh)] overflow-y-auto"
       hx-get="/nutrizionista/picker?variation_id={{.VariationID}}&kind=ingredient&q=" hx-trigger="load" hx-swap="innerHTML">
    <p class="px-5 py-4 text-muted animate-pulse motion-reduce:animate-none">{{t "plan.loading"}}</p>
  </div>
</div>
{{end}}
