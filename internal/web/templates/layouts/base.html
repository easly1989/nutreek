{{define "layout"}}<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}Nutreek{{end}}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <nav class="bg-white border-b border-slate-200">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="font-semibold text-lg tracking-tight">Nutreek</a>
      {{if .User}}
        <div class="flex items-center gap-4 text-sm">
          <span class="text-slate-600">{{.User.DisplayName}}</span>
          <form method="post" action="/logout" class="inline">
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
            <button class="text-slate-700 hover:underline">Esci</button>
          </form>
        </div>
      {{else}}
        <div class="flex items-center gap-3 text-sm">
          <a href="/login" class="hover:underline">Login</a>
          <a href="/register" class="hover:underline">Registrati</a>
        </div>
      {{end}}
    </div>
  </nav>
  <main class="max-w-5xl mx-auto px-4 py-8">
    {{if .Flash}}
      <div class="mb-4 rounded border border-amber-200 bg-amber-50 text-amber-900 px-4 py-2">{{.Flash}}</div>
    {{end}}
    {{block "content" .}}{{end}}
  </main>
</body>
</html>{{end}}
